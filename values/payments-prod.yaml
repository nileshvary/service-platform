# payments :: PRODUCTION
#
# A SECOND, DIFFERENT SERVICE — from the exact same chart.
#
# Without Helm, adding a service means copying 5 YAML files and hand-editing
# every name, label and selector in each one. That is where the
# selector-mismatch outage you debugged comes from.

nameOverride: payments

replicaCount: 2

image:
  tag: "6.7.1"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

config:
  PODINFO_UI_COLOR: "#da3633"
  PODINFO_UI_MESSAGE: "payments :: PROD"
