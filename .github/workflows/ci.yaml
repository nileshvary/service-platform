# =============================================================================
# CI/CD PIPELINE
#
# ORDERING PRINCIPLE: FAIL FAST AND CHEAP.
# Lint takes 10 seconds. Integration tests take 10 minutes. Put the cheap
# checks first so a typo does not burn ten minutes of runner time.
#
#   lint (20s) -> validate (40s) -> build (2m) -> scan (1m) -> publish -> deploy
#                                                       ^
#                                          CRITICAL CVEs stop here.
#                                          Nothing reaches the registry.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you run it by hand from the Actions tab — useful while learning.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# LEAST PRIVILEGE. The default token can write to the repo; we narrow it.
# `packages: write` is only needed to push an image. `id-token: write`
# enables OIDC — how you get short-lived cloud credentials instead of
# storing long-lived AWS keys in GitHub secrets.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:

  # ===========================================================================
  # STAGE 1 — LINT.  Seconds. Catches typos before anything expensive runs.
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: helm lint
        # Checks chart structure, required fields, template syntax.
        run: helm lint charts/service

      - name: helm lint with each values file
        # A chart can lint fine and still break with a specific values file.
        # Lint with EVERY combination you actually deploy.
        run: |
          for v in values/orders-prod.yaml values/orders-staging.yaml \
                   values/payments-prod.yaml values/shipments-prod.yaml; do
            echo "=== $v ==="
            helm lint charts/service -f "$v"
          done

      - name: YAML syntax
        run: |
          pip install --quiet yamllint
          # relaxed: we care about broken YAML, not line length opinions
          yamllint -d relaxed labs/ values/ || true

  # ===========================================================================
  # STAGE 2 — VALIDATE. Render the chart and check it against the real
  # Kubernetes API schema. Catches a wrong apiVersion or a misspelled field
  # BEFORE it reaches a cluster.
  # ===========================================================================
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    needs: lint            # only runs if lint passed
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz && sudo mv kubeconform /usr/local/bin/

      - name: Render and validate every environment
        run: |
          for v in values/orders-prod.yaml values/orders-staging.yaml \
                   values/payments-prod.yaml values/shipments-prod.yaml; do
            name=$(basename "$v" .yaml)
            echo "=== $name ==="
            helm template "$name" charts/service -f "$v" \
              | kubeconform -strict -summary -ignore-missing-schemas
          done

      - name: Render diff artifact
        # Upload the rendered YAML so a reviewer can see exactly what would
        # change. On a real team this is what you attach to the PR.
        run: |
          mkdir -p rendered
          for v in values/*.yaml; do
            helm template "$(basename $v .yaml)" charts/service -f "$v" \
              > "rendered/$(basename $v .yaml).yaml" || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered/

  # ===========================================================================
  # STAGE 3 — BUILD.  Tagged with the GIT SHA, never "latest".
  # "latest" is unrollbackable and unreproducible: you cannot tell what is
  # running, and two pods pulling it at different times can run different code.
  # ===========================================================================
  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long        # the immutable one that matters
            type=ref,event=branch
            type=ref,event=pr

      - name: Build (no push yet)
        # DELIBERATE: build to a local tarball first. We scan BEFORE the
        # image can reach the registry. Scanning after push means a
        # vulnerable image is already available to pull.
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: local/demo:${{ github.sha }}
          cache-from: type=gha          # layer cache between runs
          cache-to: type=gha,mode=max

      - name: Save image for the scan job
        run: docker save local/demo:${{ github.sha }} -o /tmp/image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1

  # ===========================================================================
  # STAGE 4 — SCAN.  THE GATE.
  #
  # Your resume says Snyk. Trivy is used here because it needs no account or
  # token; the Snyk equivalent is commented below and the CONCEPT is identical.
  #
  # THRESHOLD DECISION — the real interview question:
  #   We fail on CRITICAL only. Failing on every HIGH means dozens of
  #   failures a day, most unexploitable in context, and within two weeks
  #   someone adds --continue-on-error and the gate is dead.
  #   A GATE THAT IS ALWAYS BYPASSED IS WORSE THAN NO GATE: it creates
  #   false confidence. High and medium go to a report and a ticket.
  # ===========================================================================
  scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp

      - run: docker load -i /tmp/image.tar

      # ---- 1. CONTAINER SCAN: CVEs in the base image and OS packages ----
      - name: Trivy image scan (CRITICAL fails the build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/demo:${{ github.sha }}
          format: table
          exit-code: '1'              # <-- THIS is what makes it a gate
          severity: CRITICAL
          ignore-unfixed: true        # no point failing on what cannot be fixed

      # ---- 2. Report everything else, but do NOT fail ----
      - name: Trivy full report (informational)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/demo:${{ github.sha }}
          format: table
          exit-code: '0'              # report only
          severity: HIGH,MEDIUM

      # ---- 3. IaC SCAN: insecure Kubernetes manifests ----
      # Catches privileged containers, no resource limits, running as root,
      # hostNetwork — before they are ever applied.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: charts/
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      # ---- THE SNYK EQUIVALENT (needs a SNYK_TOKEN secret) ----
      # - name: Snyk container
      #   uses: snyk/actions/docker@master
      #   env:
      #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      #   with:
      #     image: local/demo:${{ github.sha }}
      #     args: --severity-threshold=critical --file=app/Dockerfile
      #
      # - name: Snyk monitor           # <-- the part people forget
      #   # Build-time scanning catches what is known TODAY. A CVE published
      #   # tomorrow affects the image you shipped yesterday. `monitor` keeps
      #   # watching the deployed artifact and alerts when something new lands.
      #   run: snyk container monitor local/demo:${{ github.sha }}

  # ===========================================================================
  # STAGE 5 — PUBLISH. Only on main, only after the scan passed.
  # ===========================================================================
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: scan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is generated per-run and expires when the job ends.
          # No stored credential to leak.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha

  # ===========================================================================
  # STAGE 6 — DEPLOY. Gated by a manual approval environment.
  #
  # `environment: production` is what creates the approval gate. Configure
  # required reviewers in Settings -> Environments and the job PAUSES here
  # until a human clicks Approve.
  #
  # WHERE GATES BELONG: prod, anything touching data, out-of-hours.
  # WHERE THEY DO NOT: every deploy. A gate nobody reads is theatre, and it
  # trains people to click approve without looking — worse than no gate.
  # ===========================================================================
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    environment: production          # <-- the approval gate
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Render the release CI would apply
        # CLIENT-side render. GitHub-hosted runners have no route to the
        # cluster, so this proves one thing only: chart + values + image tag
        # produce valid manifests for this environment.
        #
        # --dry-run=client is load-bearing, not cosmetic. Plain --dry-run
        # still calls the API server for capabilities discovery, which is
        # why run #2 failed with "kubernetes cluster unreachable".
        #
        # --atomic and --wait are deliberately NOT here: they describe how
        # to wait for a real rollout, and there is nothing to wait for in a
        # client render. Leaving them in would be cargo cult.
        run: |
          helm upgrade --install orders charts/service \
            -f values/orders-prod.yaml \
            --set image.tag=${{ github.sha }} \
            --namespace prod \
            --dry-run=client

      - name: The real deploy, for reference
        # On a cluster CI can actually reach -- EKS via the OIDC role above,
        # or a self-hosted runner inside the VPC -- the command drops the
        # dry-run and adds the flags that make "success" mean "pods are
        # serving traffic" rather than "the API server accepted the YAML":
        #
        #   --wait     : wait for pods to become Ready
        #   --timeout  : bound that wait, or a hung rollout hangs CI forever
        #   --atomic   : roll the release back automatically if it fails
        #                (Helm 4 renamed this to --rollback-on-failure)
        #
        # NOT having cluster credentials in CI is a real gap, not a lab
        # artifact. See docs/DECISIONS.md ADR-006.
        run: |
          echo "helm upgrade --install orders charts/service \\"
          echo "  -f values/orders-prod.yaml \\"
          echo "  --set image.tag=${{ github.sha }} \\"
          echo "  --namespace prod \\"
          echo "  --wait --timeout 5m --atomic"

      - name: Post-deploy smoke test
        # A deploy that "succeeded" because Kubernetes accepted the YAML is
        # not a deploy that works. Hit a real endpoint.
        run: echo "curl -f https://orders.internal/healthz   -- not run, no cluster from CI"
