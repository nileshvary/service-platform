# ============================================================================
# STEP 2 of 3 — ALLOW DNS
#
# THE FIRST RULE YOU WRITE IN EVERY NAMESPACE, ALWAYS.
#
# DNS is network traffic. Under default-deny a pod cannot reach CoreDNS, so
# every hostname lookup times out and every service call fails before it
# even opens a TCP connection. This is the single most common default-deny
# mistake in production.
#
# Note BOTH udp and tcp on 53: DNS falls back to TCP for large responses.
# Allowing only UDP works until the day it doesn't, which is worse.
#
# The namespaceSelector uses kubernetes.io/metadata.name, a label Kubernetes
# adds to every namespace automatically.
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: prod
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: staging
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
